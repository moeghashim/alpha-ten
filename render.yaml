services:
  # ── Landing page + form + status UI ───────────────────────────────────────
  - type: web
    name: tenwhy-alpha-web
    runtime: node
    rootDir: apps/web
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    domains:
      - alpha.tenwhy.com
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  # ── Orchestrator API (Cursor + GitHub + Render clients) ───────────────────
  - type: web
    name: tenwhy-alpha-api
    runtime: node
    rootDir: apps/api
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    domains:
      - api.alpha.tenwhy.com
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tenwhy-alpha-db, property: connectionString }
      - key: CURSOR_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_ORG
        sync: false
      - key: GITHUB_TEMPLATE_REPO
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: RENDER_REGION
        value: oregon
      - key: PLATFORM_BASE_URL
        sync: false
      - key: DATA_API_BASE_URL
        sync: false

  # ── Multi-tenant document store (the shared DB API) ───────────────────────
  - type: web
    name: tenwhy-alpha-data
    runtime: node
    rootDir: apps/data-api
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    domains:
      - data.alpha.tenwhy.com
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tenwhy-alpha-db, property: connectionString }
      - key: MAX_DOCS_PER_APP
        value: "10000"
      - key: MAX_BODY_BYTES
        value: "1048576"
      - key: RATE_LIMIT_PER_SEC
        value: "50"

databases:
  - name: tenwhy-alpha-db
    databaseName: tenwhy_alpha
    user: tenwhy_alpha
    plan: starter
